name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suite expects the compose services by hostname (mysql, redis, s3),
      # so it runs inside the same containers as local development.
      - name: Start services
        run: docker compose up -d --build --wait mysql redis s3 backend

      - name: Install PHP dependencies
        run: docker compose exec -T backend composer install --no-interaction --no-progress --prefer-dist

      - name: Create test database
        run: |
          docker compose exec -T mysql mysql -uroot -psecret -e "
            CREATE DATABASE IF NOT EXISTS ifotoset_testing;
            GRANT ALL PRIVILEGES ON ifotoset_testing.* TO 'ifotoset_user'@'%';
            FLUSH PRIVILEGES;"

      - name: Code style (changed files)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD -- 'backend/*.php' | sed 's#^backend/##')
          if [ -n "$files" ]; then docker compose exec -T backend vendor/bin/pint --test $files; fi

      - name: Run tests
        run: docker compose exec -T backend php artisan test

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 backend mysql

  assets:
    name: Build assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
