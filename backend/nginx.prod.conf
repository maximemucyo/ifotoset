# ==============================================================================
# ifotoset Production Nginx Configuration (Unified Laravel Full-Stack Monolith)
# ==============================================================================

# Optional fallback upstream to Next.js (port 3004) for emergency rollback
upstream nextjs_fallback {
    server 127.0.0.1:3004;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ifotoset.com www.ifotoset.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ifotoset.com www.ifotoset.com;

    root /home/maxime/Documents/projects/ifotoset/backend/public;
    index index.php index.html;

    # SSL Certificates (managed via Certbot or aaPanel)
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    charset utf-8;

    # Gzip / Compression Settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Static Assets Cache (Vite generated bundles with hash in filename)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon & Robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Main Full-Stack Application Routing (Laravel PHP-FPM)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Execution
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        # For Unix socket:
        # fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Prevent access to hidden / dot files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ==============================================================================
    # EMERGENCY ROLLBACK INSTRUCTIONS:
    # To roll back traffic to the Next.js server instantly, replace the root 'location /'
    # block above with:
    #
    # location / {
    #     proxy_pass http://nextjs_fallback;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
    # Then run: nginx -s reload
    # ==============================================================================
}
