# ==============================================================================
# ifotoset Production Nginx Configuration (Full-Stack Laravel Monolith)
# File: ifotoset-laravel.conf
# Target Symlink: /etc/nginx/sites-enabled/ifotoset.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ifotoset.com www.ifotoset.com *.ifotoset.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ifotoset.com www.ifotoset.com *.ifotoset.com;

    # Adjust to your deployment web root
    root /home/maxime/Documents/projects/ifotoset/backend/public;
    index index.php index.html;

    # SSL Certificate configuration (managed via Certbot or aaPanel)
    # ssl_certificate /etc/letsencrypt/live/ifotoset.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ifotoset.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client upload limits for high-resolution galleries
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    charset utf-8;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Immutable static Vite bundles
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static files & Favicons
    location = /favicon.ico { expires 30d; add_header Cache-Control "public, max-age=2592000"; access_log off; log_not_found off; }
    location = /robots.txt  { expires 1d; add_header Cache-Control "public, max-age=86400"; access_log off; log_not_found off; }
    location = /logo.png    { expires 30d; add_header Cache-Control "public, max-age=2592000"; access_log off; log_not_found off; }

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        # Choose tcp port or unix socket depending on your host setup:
        fastcgi_pass 127.0.0.1:9000;
        # fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
