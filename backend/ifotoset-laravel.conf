# ==============================================================================
# ifotoset nginx configuration (reference)
#
# Production currently runs Apache on aaPanel (see public/.htaccess). This file
# is the single nginx source of truth if the site moves to nginx.
# Security headers are sent by Laravel (App\Http\Middleware\SecurityHeaders),
# so they are not repeated here. nginx drops server-level add_header lines in
# any location that sets its own, which is why static locations include
# snippets/ifotoset-static-headers.conf.
#
# snippets/ifotoset-static-headers.conf:
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# ==============================================================================

# HTTP -> HTTPS. www goes straight to the apex in one hop.
server {
    listen 80;
    listen [::]:80;
    server_name www.ifotoset.com;
    return 301 https://ifotoset.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ifotoset.com *.ifotoset.com;
    return 301 https://$host$request_uri;
}

# HTTPS www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ifotoset.com;

    # ssl_certificate /etc/letsencrypt/live/ifotoset.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ifotoset.com/privkey.pem;

    return 301 https://ifotoset.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Apex plus every photographer subdomain ({username}.ifotoset.com)
    server_name ifotoset.com *.ifotoset.com;

    root /www/wwwroot/ifotoset.com/backend/public;
    index index.php;

    # ssl_certificate /etc/letsencrypt/live/ifotoset.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ifotoset.com/privkey.pem;

    # Media goes straight to B2 via presigned URLs; only small form posts reach PHP
    client_max_body_size 20M;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    # brotli on; brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;  # if ngx_brotli is installed

    # Content-hashed Vite bundles
    location /build/ {
        include snippets/ifotoset-static-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        include snippets/ifotoset-static-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ ^/(logo-mark\.webp|logo\.png|favicon\.(ico|svg)|favicon-64\.png|apple-touch-icon\.png|og-default\.jpg|icon-[a-z0-9-]+\.png)$ {
        include snippets/ifotoset-static-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        log_not_found off;
    }

    location ~ ^/(robots\.txt|site\.webmanifest)$ {
        include snippets/ifotoset-static-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Hidden dotfiles (.env, .git, …)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
