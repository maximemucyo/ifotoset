# ==============================================================================
# ifotoset Emergency Fallback Nginx Configuration (Next.js :3004)
# File: ifotoset-nextjs-fallback.conf
# Target Symlink: /etc/nginx/sites-enabled/ifotoset.conf
#
# EMERGENCY ROLLBACK INSTRUCTION:
#   sudo ln -sf /etc/nginx/sites-available/ifotoset-nextjs-fallback.conf /etc/nginx/sites-enabled/ifotoset.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# RESTORE TO LARAVEL:
#   sudo ln -sf /etc/nginx/sites-available/ifotoset-laravel.conf /etc/nginx/sites-enabled/ifotoset.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream nextjs_backend {
    server 127.0.0.1:3004;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name ifotoset.com www.ifotoset.com *.ifotoset.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ifotoset.com www.ifotoset.com *.ifotoset.com;

    # Root pointing to Laravel public for direct /api and static uploads
    root /home/maxime/Documents/projects/ifotoset/backend/public;
    index index.php index.html;

    # SSL Certificate configuration (managed via Certbot or aaPanel)
    # ssl_certificate /etc/letsencrypt/live/ifotoset.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ifotoset.com/privkey.pem;

    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    charset utf-8;

    # API Routes (/api/*) are handled directly by Laravel PHP-FPM
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler for API requests
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        # fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Next.js Static Asset Chunk Caching
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All Web Frontend Traffic routes to Next.js server on port 3004
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Deny access to hidden dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
