services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifotoset_backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - '.:/var/www/html'
    environment:
      - PHP_CLI_SERVER_WORKERS=8
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ifotoset
      - DB_USERNAME=ifotoset_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifotoset_queue
    restart: unless-stopped
    command: php artisan queue:work --queue=media,default --verbose --tries=3 --sleep=3 --max-time=3600
    volumes:
      - '.:/var/www/html'
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ifotoset
      - DB_USERNAME=ifotoset_user
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue_photos:
    container_name: ifotoset_queue_photos
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --queue=photos,media --verbose --tries=3 --sleep=3 --max-time=3600
    volumes:
      - '.:/var/www/html'
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ifotoset
      - DB_USERNAME=ifotoset_user
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifotoset_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - '.:/var/www/html'
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ifotoset
      - DB_USERNAME=ifotoset_user
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local S3-compatible object storage (stands in for Backblaze B2 + Cloudflare CDN in development)
  s3:
    image: 'chrislusf/seaweedfs:latest'
    restart: unless-stopped
    container_name: ifotoset_s3
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - '${FORWARD_S3_PORT:-8333}:8333'
    volumes:
      - 'ifotoset_s3:/data'
      - './docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro'

  mysql:
    image: 'mysql/mysql-server:8.0'
    restart: unless-stopped
    container_name: ifotoset_mysql
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-ifotoset}'
      MYSQL_USER: '${DB_USERNAME:-ifotoset_user}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'ifotoset_mysql:/var/lib/mysql'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-secret}']
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    container_name: ifotoset_redis
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'ifotoset_redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      retries: 3
      timeout: 5s

  mailpit:
    image: 'axllent/mailpit:latest'
    restart: unless-stopped
    container_name: ifotoset_mailpit
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
  ifotoset_s3:
    driver: local
  ifotoset_mysql:
    driver: local
  ifotoset_redis:
    driver: local
